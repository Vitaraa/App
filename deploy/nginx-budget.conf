# nginx site for the Budget app.
# Install to: /etc/nginx/sites-available/budget  then symlink into sites-enabled.
#
# nginx serves the built React app (static files) directly and forwards
# only /api/ requests to the Node process on 127.0.0.1:4000.

server {
    listen 80;
    listen [::]:80;

    # Use your server's IP or a hostname. "_" matches any host.
    server_name _;

    # Built frontend (output of `npm run build` in client/).
    root /opt/budget/client/dist;
    index index.html;

    # API -> Node backend.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any non-file route returns index.html so the React
    # router/app can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite fingerprints filenames).
    location /assets/ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
